<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="player-view.css">
    <title>Initiative Tracker | Player View</title>
</head>

<body>
    <!-- I added this x to act as a way to get back to the dm view if I needed to without  -->
    <!-- adding a menu bar to this screen beacuse I intend to have this up fullscreen  -->
    <!-- on a tv behind me during D&D sessions. -->
    <a class="player-x" href="index.html"><img class="x" src="/assets/x.svg" alt="Close"></a>

    <!-- This will display when there are no combatants -->
    <div class="no-combatants-message hidden"><p>No Combatants</p></div>

    <section class="player-view-section">

        <!-- Bar for the top arrow that will be hidden when the current combatant is on arrow-bar-2 -->
        <div class="arrow-bar">
            <h1 class="arrow arrow-1 hidden">⬇</h1>
        </div>

        <!-- Player View Card Template for Players -->
        <div class="add-player player-box-template hidden">
            <h1>Player Name</h1>

            <div class="major-stats">
                <h3 class="ac-card-num">12</h3>
                <h2>70/100</h2>
            </div>

            <label for="HP"></label>
            <meter value="70" id="HP" min="0" max="100" low="33" high="66" optimum="80"></meter>
        </div>

        <!-- Bar for the 2nd row arrow that will be hidden when the current combatant is on arrow-bar-1 -->
        <div class="arrow-bar arror-bar-row-2">
            <h1 class="arrow arrow-2 hidden">⬇</h1>
        </div>

        <!-- Player View Card Template for Monsters -->
        <div class="add-monster monster-box-template hidden">
            <h1>Monster Name</h1>

            <div class="major-stats">
                <h3 class="ac-card-num">?</h3>
                <h2>BARELY INJURED</h2>
            </div>
        </div>

    </section>
</body>

</html>
