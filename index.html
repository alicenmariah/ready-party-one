<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" href="reset.css"> -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/khi2rfp.css">
    <script src="app.js"></script>
    <title>Initiative Tracker | DM View</title>
</head>
<body class="background">
    <header class="container">
        <div class="site-branding-box">
            <img src="assets/RP2.svg" alt="">
            <h1>READY PARTY ONE</h1>
        </div>

        
            
        <nav>
                <a class="hover-nav" href="player-view.html">Player View</a>
                
        </nav>
    </header>
    <br>
    <main>
        <section class="add-stuff">
            <form action="">
                <article class="add-player player add height">
                    

                    <div>
                        
                        <h1 class="add-title player-title">ADD PLAYER</h1>
                        <br>
                </div>
                <div class="group-row">
                    <div class="input-groups">
            
                        <label for="mon-search">NPC Search</label>
                        <input type="search" id="mon-search" name="mon-search" placeholder="⌕ D&D 5e SRD">
                    </div>                
                    
                    <div class="input-groups">
            
                        <label for="player-name">Name</label>
                        <input type="text" id="player-name" name="player-name">

                        
                    </div>
                    </div>

                    <div class="input-groups hp-ac">
                                                                    <label for="player-init-num">#</label>
                    <input type="text" id="player-init-num" name="player-init-num" class="small-input" placeholder="INIT">

                    <label for="player-current-hp">HP</label>
                    <input type="text" id="player-current-hp" name="player-current-hp" class="small-input" placeholder="Now">
                    <label for="player-max-hp">/</label>
                    <input type="text" id="player-max-hp" name="player-max-hp" class="small-input" placeholder="Max">
                    <br>
                    <label for="player-ac">AC</label>
                    <input type="text" id="player-ac" name="player-ac" class="small-input">
                    </div>
                    
                    <div class="file-box">
                            <button type="button" onclick="document.getElementById('myFile').click()">
                                Add Token Image?
                            </button>
                            <input type="file" id="player-image" name="filename" hidden>
                        </div>
                    </div>
                   
                    <div class="input-groups add-button">
                    
                        <input type="button" id="add-player-button" value="+ Player"><br>
                        
                    </div>
                   
            
                </article>
                </form>
            

                <form action="">
                    
                    <article class="add-monster monster add height">

                        <div class="input-groups">
                            <h1 class="add-title monster-title">ADD MONSTER</h1>
                        </div>
                        
                    <div class="group-row">

                    
                    <div class="input-groups">
            
                        <label for="mon-search">Monster Search</label>
                        <input type="search" id="mon-search" name="mon-search" placeholder="⌕ D&D 5e SRD">
                        
                    </div>

                    <div class="input-groups">
                        
                        <label for="player-name">Name</label>
                        <input type="text" id="player-name" name="player-name">
                    </div>

                    </div>
                <div class="group-row">
                    <div class="input-groups">
                        <label for="player-init-num">#</label>
                        <input type="text" id="player-init-num" name="player-init-num" class="small-input">
                        
                    <label for="player-current-hp">HP</label>
                    <input type="text" id="player-current-hp" name="player-current-hp" class="small-input" placeholder="Now">

                    <label for="player-max-hp">/</label>
                    <input type="text" id="player-max-hp" name="player-max-hp" class="small-input" placeholder="Max">
                    <label for="player-ac">AC</label>
                    <input type="text" id="player-ac" name="player-ac" class="small-input">
                    </div>

                    <div class="input-groups">
                    <label for="mob-group-check">Group?</label>
                     <select name="pick-mob-group-color" id="pick-mob-group-color">
                        <option value="">Group Colors</option>
                        <option value="red">Red</option>
                        <option value="blue">Blue</option>
                        <option value="yellow">Yellow</option>
                        <option value="green">Green</option>
                        <option value="orange">Orange</option>
                        <option value="purple">Purple</option>
                        <option value="pink">Pink</option>
                     </select>
                </div>
                        
                    </div>
                    <div class="file-box">
                            <button type="button" onclick="document.getElementById('myFile').click()">
                                Add Token Image?
                            </button>
                            <input type="file" id="monster-image" name="filename" hidden>
                        </div>
                     <div class="input-groups add-button add-stuff">
                        <input type="button" id="add-monster-button" value="+ Monster">
                    
                    </div>
                    

                </article>
                </form>
        </section>

            
                <form action="">
                    <article class="player-init-item add-player mon-play hidden">
                        <img class="frame-placeholder" src="assets/frame-placeholder.svg" alt="">

                        <p>#</p>
                        <p>Player Name:</p>
                        <p>AC:</p>
                        <p>Current HP:</p>
                        <p>Max HP:</p>

                            <div class="pick-condition">
                                <select name="pick-condition" id="player-condition">
                                    <option value="">Add Condition?</option>
                                    <option value="blinded">Blinded</option>
                                    <option value="charmed">Charmed</option>
                                    <option value="deafened">Deafened</option>
                                    <option value="frightened">Frightened</option>
                                    <option value="grappled">Grappled</option>
                                    <option value="invisible">Invisible</option>
                                    <option value="paralyzed">Paralyzed</option>
                                    <option value="petrified">Petrified</option>
                                    <option value="poisoned">Poisoned</option>
                                    <option value="prone">Prone</option>
                                    <option value="restrained">Restrained</option>
                                    <option value="stunned">Stunned</option>
                                    <option value="unconscious">Unconscious</option>
                                    <option value="dead">Dead</option>
                                </select>

                                <section class="init-add-buttons">
                                    <input type="button" id="update-init" value="Update">
                                </section>
                            </div>

                    </article>
<form action="">
    <article class="custom-monster-init-item add-monster mon-play hidden">

        <div class="hp-group">
            <p>Monster Name:</p>
            <img
                class="frame-placeholder"
                src="assets/frame-placeholder.svg"
                alt="Monster token"
            >
        </div>

        <div class="hp-group">
            <p>#</p>
            <p>AC:</p>
            <p>Group:</p>
        </div>

        <div class="hp-group">
            <p>Current HP:</p>
            <p>Max HP:</p>
        </div>

        <div class="condition-controls">
            <select name="monster-condition" id="monster-condition">
                <option value="">Add Condition?</option>
                <option value="blinded">Blinded</option>
                <option value="charmed">Charmed</option>
                <option value="deafened">Deafened</option>
                <option value="frightened">Frightened</option>
                <option value="grappled">Grappled</option>
                <option value="invisible">Invisible</option>
                <option value="paralyzed">Paralyzed</option>
                <option value="petrified">Petrified</option>
                <option value="poisoned">Poisoned</option>
                <option value="prone">Prone</option>
                <option value="restrained">Restrained</option>
                <option value="stunned">Stunned</option>
                <option value="unconscious">Unconscious</option>
                <option value="dead">Dead</option>
            </select>

            <input
                type="button"
                id="update-monster"
                value="Update"
            >
        </div>

    </article>
</form>
            

        

    </main>
</body>
</html>
